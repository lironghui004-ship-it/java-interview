<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f2ec">
<title>八股刷题</title>
<style>
:root{
  --bg:#f5f2ec; --bg-soft:#efeae1; --card:#fff; --card-soft:#faf8f4;
  --text:#231f1a; --sub:#7a7064; --faint:#a2988b; --line:rgba(60,45,25,.10);
  --accent:#2f3b52; --accent-soft:rgba(47,59,82,.08);
  --gold:#b98b3e; --ok:#2f7d58; --ok-soft:rgba(47,125,88,.12);
  --no:#c0392b; --no-soft:rgba(192,57,43,.12);
  --code-bg:#2a2f3a; --code-text:#e6e1d8; --code-border:rgba(0,0,0,.18);
  --shadow:0 6px 28px rgba(60,45,25,.08), 0 1px 3px rgba(60,45,25,.05);
  --glow1:rgba(214,168,84,.20); --glow2:rgba(196,120,80,.13);
  --r:20px;
}
[data-theme="dark"]{
  --bg:#14161b; --bg-soft:#1b1e25; --card:#1d2129; --card-soft:#232833;
  --text:#ebe7e0; --sub:#a09a90; --faint:#726c63; --line:rgba(255,255,255,.09);
  --accent:#8fb2e0; --accent-soft:rgba(143,178,224,.14);
  --gold:#d9ab5c; --ok:#57b98a; --ok-soft:rgba(87,185,138,.16);
  --no:#e0705f; --no-soft:rgba(224,112,95,.16);
  --code-bg:#161a23; --code-text:#e6ebf2; --code-border:rgba(255,255,255,.07);
  --shadow:0 8px 32px rgba(0,0,0,.38), 0 1px 3px rgba(0,0,0,.3);
  --glow1:rgba(214,168,84,.13); --glow2:rgba(150,80,60,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  transition:background .3s,color .3s;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 70% at 12% -8%,var(--glow1),transparent 62%),
             radial-gradient(90% 60% at 92% 108%,var(--glow2),transparent 60%);
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;font-size:16px}
input{font-family:inherit}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto;width:100%}

/* ---------- header ---------- */
header{padding:14px 18px 6px;display:flex;align-items:flex-start;gap:12px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.5px}
.brand .stat{margin-top:3px;font-size:12.5px;color:var(--sub)}
.brand .stat b{color:var(--gold);font-weight:600}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;box-shadow:var(--shadow);flex:none;transition:transform .15s}
.iconbtn:active{transform:scale(.93)}
.iconbtn.on{background:var(--gold);color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(185,139,62,.32)}
[data-theme="dark"] .iconbtn.on{color:#1a1611}

/* ---------- 分类按钮 ---------- */
.catbtn{display:flex;align-items:center;gap:9px;margin:8px 18px 0;height:48px;padding:0 15px;
  border-radius:15px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:15.5px;font-weight:650;flex:none;transition:transform .15s}
.catbtn:active{transform:scale(.98)}
.catbtn .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.catbtn .cc{font-size:12.5px;color:var(--sub);font-weight:500;flex:none}
.pbar{height:2px;background:var(--line);margin:8px 18px 0;border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--ok));transition:width .35s}

/* ---------- 左侧抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(15,12,8,.5);z-index:60;opacity:0;pointer-events:none;
  transition:opacity .22s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(80vw,330px);background:var(--card);z-index:70;
  transform:translateX(-104%);transition:transform .26s cubic-bezier(.32,.72,.28,1);
  display:flex;flex-direction:column;border-radius:0 24px 24px 0;
  box-shadow:14px 0 50px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top)}
.drawer.open{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:18px 14px 10px 22px;flex:none}
.dhead b{font-size:17px;letter-spacing:.5px}
.dclose{width:36px;height:36px;border-radius:12px;background:var(--bg-soft);display:grid;place-items:center;color:var(--sub)}
.dclose:active{transform:scale(.92)}
.dbody{flex:1;overflow-y:auto;padding:0 10px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.dbody::-webkit-scrollbar{width:0}
.dsec{padding:16px 12px 6px;font-size:12px;color:var(--faint);letter-spacing:2px;font-weight:600}
.ditem{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  padding:12px 14px;border-radius:13px;font-size:15.5px;min-height:48px;color:var(--text);text-align:left;line-height:1.35}
.ditem .n{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
.ditem.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.ditem.on .n{color:var(--accent);opacity:.75}
.ditem:active{background:var(--bg-soft)}

/* ---------- 图片灯箱 ---------- */
.lb{position:fixed;inset:0;z-index:80;background:rgba(8,7,5,.94);display:none;flex-direction:column}
.lb.show{display:flex}
.lb-in{flex:1;overflow:auto;display:flex;-webkit-overflow-scrolling:touch}
.lb-in img{margin:auto;max-width:100%;max-height:100%;touch-action:pan-x pan-y}
.lb-in img.raw{max-width:none;max-height:none}
.lb-tip{flex:none;text-align:center;color:rgba(255,255,255,.55);font-size:12.5px;
  padding:10px 0 calc(10px + env(safe-area-inset-bottom))}

/* ---------- 工具行 ---------- */
.tools{display:flex;gap:8px;padding:10px 18px 8px;align-items:center;flex:none}
.search{flex:1 1 46%;position:relative;min-width:110px}
.filters{flex:1 1 54%;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;justify-content:flex-end}
.filters::-webkit-scrollbar{display:none}
.search input{width:100%;height:42px;padding:0 38px 0 38px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:15px;outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--gold)}
.search input::-webkit-search-cancel-button{display:none}
.search svg{position:absolute;left:13px;top:13px;opacity:.4}
.sclear{position:absolute;right:7px;top:7px;width:28px;height:28px;border-radius:50%;
  background:var(--bg-soft);display:grid;place-items:center;color:var(--sub)}
.sclear.hide{display:none}
.sclear:active{transform:scale(.9)}
.sTip{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:2px 18px 4px;
  font-size:12.5px;color:var(--sub);flex:none}
.sTip.hide{display:none}
.sTip b{color:var(--gold);font-weight:600}
.sTip button{font-size:12.5px;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
mark{background:rgba(185,139,62,.30);color:inherit;border-radius:3px;padding:0 1px}
[data-theme="dark"] mark{background:rgba(217,171,92,.32)}
.tbtn{flex:none;height:42px;padding:0 13px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  font-size:13.5px;color:var(--sub);display:flex;align-items:center;gap:5px;transition:all .18s}
.tbtn.on{background:var(--gold);color:#fff;border-color:transparent;font-weight:600}
[data-theme="dark"] .tbtn.on{color:#1a1611}
.tbtn:active{transform:scale(.95)}

/* ---------- 卡片 ---------- */
main{flex:1;min-height:0;padding:8px 18px 10px;display:flex}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);width:100%;
  display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);overflow:hidden;margin-bottom:10px}
.cmeta{display:flex;align-items:center;gap:8px;padding:16px 20px 0;flex:none}
.badge{font-size:12px;padding:4px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.dot{width:4px;height:4px;border-radius:50%;background:var(--faint)}
.prog{margin-left:auto;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.prog b{color:var(--text);font-size:15px;font-weight:700}

.qwrap{padding:14px 20px 18px;flex:none}
.q{font-size:22px;line-height:1.5;font-weight:650;margin:0;letter-spacing:.2px;word-break:break-word}
.qflag{margin-top:8px;font-size:12.5px;display:flex;gap:8px;align-items:center;min-height:18px}
.qflag span{padding:3px 9px;border-radius:7px;font-weight:600}
.qflag .k{background:var(--ok-soft);color:var(--ok)}
.qflag .u{background:var(--no-soft);color:var(--no)}

.markRow{display:none;gap:8px;padding:0 20px 14px;flex:none}
.markRow.show{display:flex}
.markRow button{flex:1;height:42px;border-radius:13px;font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card-soft);border:1px solid var(--line)}
.markRow .ok{color:var(--ok)}
.markRow .no{color:var(--no)}
.markRow .ok.on{background:var(--ok);color:#fff;border-color:transparent}
.markRow .no.on{background:var(--no);color:#fff;border-color:transparent}

.reveal{margin:0 20px 4px;height:54px;border-radius:16px;background:var(--accent);color:#fff;
  font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 16px rgba(47,59,82,.22);transition:transform .15s,opacity .2s;flex:none}
[data-theme="dark"] .reveal{color:#12151b;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.reveal:active{transform:scale(.97)}
.reveal.hide{display:none}

.ans{flex:1;min-height:0;display:none;flex-direction:column;border-top:1px solid var(--line);margin-top:14px}
.ans.show{display:flex}
.mdbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 22px 32px;
  font-size:16px;line-height:1.9;color:var(--text)}
.mdbody::-webkit-scrollbar{width:4px}
.mdbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

/* markdown */
.md h3{font-size:16.5px;margin:20px 0 10px;padding-left:10px;border-left:3px solid var(--gold);font-weight:650;line-height:1.4}
.md h3:first-child{margin-top:0}
.md h4{font-size:15.5px;margin:16px 0 8px;font-weight:650;color:var(--accent)}
.md p{margin:0 0 13px}
.md strong{font-weight:700;color:var(--gold)}
.md ul,.md ol{margin:0 0 13px;padding-left:22px}
.md li{margin:5px 0}
.md code{background:var(--bg-soft);padding:2px 7px;border-radius:6px;font-size:14px;
  font-family:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;color:var(--no)}
.md pre{background:var(--code-bg);color:var(--code-text);border-radius:14px;padding:16px 18px;
  overflow-x:auto;margin:0 0 16px;font-size:14.5px;line-height:1.75;
  border:1px solid var(--code-border);
  font-family:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  -webkit-overflow-scrolling:touch}
.md pre code{background:none;padding:0;color:inherit;font-size:inherit;line-height:inherit;font-family:inherit}
.md blockquote{margin:0 0 13px;padding:10px 14px;border-left:3px solid var(--gold);
  background:var(--card-soft);border-radius:0 10px 10px 0;color:var(--sub);font-size:14.5px}
.md table{border-collapse:collapse;margin:0 0 14px;font-size:13.5px;display:block;overflow-x:auto;white-space:nowrap}
.md th,.md td{border:1px solid var(--line);padding:7px 11px;text-align:left}
.md th{background:var(--card-soft);font-weight:650}
.md a{color:var(--accent)}
.md img{display:block;max-width:100%;height:auto;border-radius:12px;margin:4px auto 14px;
  background:var(--bg-soft);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.md td img{display:inline-block;max-width:180px;vertical-align:middle;margin:0}
.md img.imgerr{min-height:64px;border:1px dashed var(--line);box-shadow:none;padding:20px 10px;font-size:12px;color:var(--faint)}

.more{margin:0 20px 10px;height:44px;border-radius:13px;border:1px dashed var(--line);
  color:var(--sub);font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;flex:none}
.more:active{transform:scale(.97)}
.more.hide{display:none}

/* 底部固定操作 */
.bar{display:flex;gap:10px;padding:8px 18px calc(10px + env(safe-area-inset-bottom));flex:none}
.bar button{height:50px;border-radius:16px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:600;
  box-shadow:var(--shadow);transition:transform .15s}
.bar button:active{transform:scale(.95)}
.bar .n{flex:1}
.bar .r{width:62px;flex:none;color:var(--gold)}
.bar button:disabled{opacity:.32}
.bar .ok{color:var(--ok)}
.bar .no{color:var(--no)}
.bar .ok.on{background:var(--ok);color:#fff;border-color:transparent}
.bar .no.on{background:var(--no);color:#fff;border-color:transparent}

/* 空状态 */
.empty{margin:auto;text-align:center;color:var(--faint);font-size:15px;line-height:2;padding:20px}
.empty b{display:block;font-size:38px;margin-bottom:6px;opacity:.4;font-weight:400}
.empty.hide{display:none}

@media (max-width:360px){
  .q{font-size:20px}
  .bar button{font-size:14px}
  .catbtn{font-size:14.5px}
}

/* 启动遮罩 */
.boot{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:24px}
.boot.done{opacity:0;pointer-events:none;transition:opacity .22s ease}
.boot-box{width:100%;max-width:320px;text-align:center}
.boot-spin{width:34px;height:34px;margin:0 auto 16px;border-radius:50%;
  border:2.5px solid var(--line);border-top-color:var(--accent);animation:bspin .8s linear infinite}
@keyframes bspin{to{transform:rotate(360deg)}}
.boot-title{font-size:15.5px;font-weight:600;color:var(--text);margin-bottom:14px}
.boot-bar{height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.boot-bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);
  transition:width .18s ease}
.boot-bar i.indet{width:35%;animation:bindet 1.1s ease-in-out infinite}
@keyframes bindet{0%{margin-left:-35%}100%{margin-left:100%}}
.boot-sub{margin-top:12px;font-size:12.5px;color:var(--faint);line-height:1.6}
.boot-retry{margin-top:16px;padding:10px 22px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:14px;font-weight:600}
.boot-retry.hide{display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>八股刷题</h1>
      <div class="stat">已掌握 <b id="kn">0</b> / <span id="tot">0</span> · 待攻克 <b id="un">0</b></div>
    </div>
    <button class="iconbtn" id="shuffleBtn" aria-label="乱序模式" title="乱序模式"></button>
    <button class="iconbtn" id="themeBtn" aria-label="切换主题"></button>
  </header>

  <button class="catbtn" id="catBtn" aria-label="选择分类">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    <span class="cn" id="catName">全部</span>
    <span class="cc" id="catNum"></span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="opacity:.45"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <div class="pbar"><i id="pbfill"></i></div>

  <div class="tools">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="kw" type="search" placeholder="搜题面…" autocomplete="off">
      <button class="sclear hide" id="kwClear" aria-label="清空搜索"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="filters" id="filters"></div>
  </div>
  <div class="sTip hide" id="sTip"></div>

  <main>
    <div class="card" id="card">
      <div class="cmeta">
        <span class="badge" id="badge">Java基础</span>
        <span class="dot"></span>
        <span style="font-size:12px;color:var(--faint)" id="src"></span>
        <span class="prog"><b id="cur">1</b> / <span id="cnt">1</span></span>
      </div>
      <div class="qwrap">
        <h2 class="q" id="q"></h2>
        <div class="qflag" id="qflag"></div>
      </div>
      <div class="markRow show" id="markRow">
        <button id="okBtn" class="ok"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>会了</button>
        <button id="noBtn" class="no"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>不会</button>
      </div>
      <button class="reveal" id="revealBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        显示答案
      </button>
      <div class="ans" id="ans">
        <div class="mdbody md" id="md"></div>
        <button class="more" id="moreBtn"></button>
      </div>
    </div>
    <div class="empty hide" id="emptyTip"><b>∅</b>没有匹配的题目<br>换个分类或关键词试试</div>
  </main>

  <div class="bar">
    <button class="n" id="prevBtn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>上一题</button>
    <button class="r" id="randBtn" title="随机跳题">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="n" id="nextBtn">下一题<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
</div>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="dhead">
    <b>选择分类</b>
    <button class="dclose" id="drawerClose" aria-label="关闭"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>

<div class="lb" id="lb">
  <div class="lb-in" id="lbIn"><img id="lbImg" alt=""></div>
  <div class="lb-tip">单击图片切换 适应/原图 · 点空白处关闭</div>
</div>

<div class="boot" id="bootOv">
  <div class="boot-box">
    <div class="boot-spin"></div>
    <div class="boot-title" id="bootTitle">正在加载题库</div>
    <div class="boot-bar"><i id="bootBar"></i></div>
    <div class="boot-sub" id="bootSub">首次加载约 1.5MB，之后秒开</div>
    <button class="boot-retry hide" id="bootRetry">重试</button>
  </div>
</div>

<script src="data.js" onerror="window.__BGB_ERR__=1"></script>
<script>
let DATA = (typeof window!=='undefined' && window.__BGB_DATA__) || null;
const CATS = ['Java基础','多线程','JVM','MySQL','Redis','Spring','MQ'];
const PRIMARY_DIRS = ['Java基础','集合类','Java并发','JVM','MySQL','Redis','Spring','SpringCloud','Kafka','RocketMQ','RabbitMQ'];

/* ---------- 存储 ---------- */
const LSK='bgb_marks', LST='bgb_theme', LSC='bgb_cat', LSS='bgb_shuffle', LSF='bgb_filter', LSP='bgb_pos';
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let marks=ld(LSK,{});

/* ---------- 状态 ---------- */
const S={cat:ld(LSC,'all'), kw:'', filter:ld(LSF,'all'), shuffle:ld(LSS,false), list:[], pos:0, order:null, revealed:false, full:false};

/* ---------- 分类统计 ---------- */
const catCount={};
DATA.forEach(d=>catCount[d.cat]=(catCount[d.cat]||0)+1);
const srcCount={};
DATA.forEach(d=>(d.srcs||[]).forEach(s=>srcCount[s]=(srcCount[s]||0)+1));
const EXTRA_CATS=[...new Set(DATA.flatMap(d=>d.srcs||[]))]
  .filter(s=>PRIMARY_DIRS.indexOf(s)<0 && CATS.indexOf(s)<0)
  .sort((a,b)=>(srcCount[b]||0)-(srcCount[a]||0));
if(S.cat!=='all'){
  if(S.cat.indexOf('x:')===0){ if(EXTRA_CATS.indexOf(S.cat.slice(2))<0) S.cat='all'; }
  else if(CATS.indexOf(S.cat)<0) S.cat='all';
}
function catLabel(c){return c==='all'?'全部':(c.indexOf('x:')===0?c.slice(2):c)}
function catNum(c){
  if(c==='all') return DATA.length;
  return c.indexOf('x:')===0 ? (srcCount[c.slice(2)]||0) : (catCount[c]||0);
}

/* ---------- 主题 ---------- */
const SUN='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const SHUF='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>';
const MOON='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12.8A8.5 8.5 0 1111.2 3a6.6 6.6 0 009.8 9.8z"/></svg>';
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeBtn').innerHTML = t==='dark'?SUN:MOON;
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content', t==='dark'?'#14161b':'#f5f2ec');
  sv(LST,t);
}
setTheme(ld(LST, null) || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
document.getElementById('themeBtn').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');

/* ---------- mini markdown ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){
  s=esc(s);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,alt,src)=>
    '<img src="'+src+'" alt="'+alt+'" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.classList.add(\'imgerr\')">');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*\*([^*]+)\*\*\*/g,'<strong><em>$1</em></strong>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  s=s.replace(/\*{2,}/g,'');  // 清理未配对的加粗标记
  return s;
}
function md2html(src){
  const blocks=[];
  src=src.replace(/```(\w*)[ \t]*(?:\n|$)([\s\S]*?)(?:```|$)/g,(m,lang,code)=>{
    blocks.push('<pre><code>'+esc(code.replace(/\n$/,''))+'</code></pre>');
    return '%%BLK'+(blocks.length-1)+'%%';
  });
  const lines=src.split('\n');
  let out=[],p=[],list=null,quote=[],tbl=null;
  const flushP=()=>{if(p.length){out.push('<p>'+inline(p.join(' ')).replace(/\n/g,'<br>')+'</p>');p=[]}};
  const flushList=()=>{
    if(list){out.push('<'+list.t+'>'+list.items.map(i=>'<li>'+inline(i)+'</li>').join('')+'</'+list.t+'>');list=null}
  };
  const flushQuote=()=>{if(quote.length){out.push('<blockquote>'+inline(quote.join(' '))+'</blockquote>');quote=[]}};
  const flushTbl=()=>{
    if(tbl){
      let h='<table><thead><tr>'+tbl.head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
      tbl.rows.forEach(r=>h+='<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>');
      out.push(h+'</tbody></table>');tbl=null;
    }
  };
  const flushAll=()=>{flushP();flushList();flushQuote();flushTbl()};
  for(let i=0;i<lines.length;i++){
    let ln=lines[i];
    let m;
    if(ln.indexOf('%%BLK')>=0){flushAll();out.push(ln.replace(/%%BLK(\d+)%%/g,(s,d)=>blocks[+d]));continue}
    if(!ln.trim()){flushAll();continue}
    if(m=ln.match(/^[ \t]*!\[[^\]]*\]\([^)]+\)[ \t]*$/)){flushAll();out.push(inline(ln.trim()));continue}
    if(m=ln.match(/^(#{1,6})\s+(.*)$/)){
      flushAll();const lv=Math.min(+m[1].length+1,4);
      out.push('<h'+lv+'>'+inline(m[2].trim())+'</h'+lv+'>');continue;
    }
    if(/^\s*\|.*\|\s*$/.test(ln)){
      flushP();flushList();flushQuote();
      const cells=ln.trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim());
      if(/^[\s:-]+$/.test(cells.join(''))&&cells.every(c=>c.indexOf('-')>=0)) continue;
      if(!tbl){tbl={head:cells,rows:[]}}else{tbl.rows.push(cells)}
      continue;
    } else flushTbl();
    if(m=ln.match(/^\s*>\s?(.*)$/)){flushP();flushList();quote.push(m[1]);continue} else flushQuote();
    if(m=ln.match(/^\s*[-*+]\s+(.*)$/)){
      flushP();flushQuote();
      if(!list||list.t!=='ul'){flushList();list={t:'ul',items:[]}}
      list.items.push(m[1]);continue;
    }
    if(m=ln.match(/^\s*\d+[.)]\s+(.*)$/)){
      flushP();flushQuote();
      if(!list||list.t!=='ol'){flushList();list={t:'ol',items:[]}}
      list.items.push(m[1]);continue;
    } else flushList();
    p.push(ln);
  }
  flushAll();
  return out.join('');
}

/* ---------- 构建列表 ---------- */
function buildList(){
  let arr=[];
  for(let i=0;i<DATA.length;i++){
    const d=DATA[i];
    if(S.cat!=='all'){
      if(S.cat.indexOf('x:')===0){
        if(!(d.srcs||[]).includes(S.cat.slice(2))) continue;
      } else if(d.cat!==S.cat) continue;
    }
    const f=marks[d.id];
    if(S.filter==='unknown'&&f!=='u') continue;
    if(S.filter==='known'&&f!=='k') continue;
    if(S.filter==='fresh'&&f) continue;
    if(S.kw){
      const k=S.kw.toLowerCase();
      if((d.q||'').toLowerCase().indexOf(k)<0) continue;
    }
    arr.push(i);
  }
  S.list=arr;
  if(S.shuffle) S.order=shuffled(arr.length); else S.order=null;
  if(S.pos>=arr.length) S.pos=0;
}
function shuffled(n){const a=[];for(let i=0;i<n;i++)a.push(i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const idxAt=p=>S.list[S.order?S.order[p]:p];

/* ---------- 搜索辅助 ---------- */
let kwAllCache={kw:'',n:0};
function countAll(kw){
  if(kwAllCache.kw===kw) return kwAllCache.n;
  const k=kw.toLowerCase();
  let n=0;
  for(let i=0;i<DATA.length;i++){
    const d=DATA[i];
    if((d.q||'').toLowerCase().indexOf(k)>=0) n++;
  }
  kwAllCache={kw:kw,n:n};
  return n;
}
function highlight(root,kw){
  if(!kw||!root||typeof document.createTreeWalker!=='function') return;
  try{
    const k=kw.toLowerCase();
    const w=document.createTreeWalker(root,4,null);
    const nodes=[];
    while(w.nextNode()) nodes.push(w.currentNode);
    for(let i=0;i<nodes.length;i++){
      const n=nodes[i], txt=n.nodeValue, low=txt.toLowerCase();
      if(low.indexOf(k)<0) continue;
      const frag=document.createDocumentFragment();
      let pos=0,j=low.indexOf(k);
      while(j>=0){
        if(j>pos) frag.appendChild(document.createTextNode(txt.slice(pos,j)));
        const mk=document.createElement('mark');
        mk.textContent=txt.substr(j,kw.length);
        frag.appendChild(mk);
        pos=j+kw.length; j=low.indexOf(k,pos);
      }
      if(pos<txt.length) frag.appendChild(document.createTextNode(txt.slice(pos)));
      if(n.parentNode) n.parentNode.replaceChild(frag,n);
    }
  }catch(e){}
}
function updateSearchTip(){
  const tip=$('sTip');
  if(!S.kw){tip.classList.add('hide');$('kwClear').classList.add('hide');return}
  $('kwClear').classList.remove('hide');
  const all=countAll(S.kw), cur=S.list.length;
  tip.classList.remove('hide');
  tip.innerHTML = cur>0
    ? '搜题面「'+esc(S.kw)+'」全库命中 <b>'+all+'</b> 题，当前范围 <b>'+cur+'</b> 题<button id="sClr">清除</button>'
    : (all>0
      ? '搜题面「'+esc(S.kw)+'」当前范围无结果，全库命中 <b>'+all+'</b> 题<button id="sAll">在全部分类里搜</button>'
      : '题面里没搜到「'+esc(S.kw)+'」（只搜题面，不搜解析）<button id="sClr">清除</button>');
  const b=$('sClr')||$('sAll');
  if(b) b.onclick=()=>{
    if(b.id==='sAll'){S.cat='all';sv(LSC,S.cat);renderCatBtn()}
    else{$('kw').value='';S.kw=''}
    S.pos=0;buildList();render();
  };
}

/* ---------- 抽屉 ---------- */
const $=id=>document.getElementById(id);
function renderCatBtn(){
  $('catName').textContent=catLabel(S.cat);
  $('catNum').textContent=catNum(S.cat)+' 题';
}
function renderDrawer(){
  const item=c=>'<button class="ditem'+(S.cat===c?' on':'')+'" data-c="'+c+'"><span>'+catLabel(c)+'</span><span class="n">'+catNum(c)+'</span></button>';
  let h='<div class="dsec">分类</div>'+item('all');
  h+='<div class="dsec">快速分类</div>';
  CATS.forEach(c=>h+=item(c));
  h+='<div class="dsec">细分分类</div>';
  EXTRA_CATS.forEach(c=>h+=item('x:'+c));
  $('dbody').innerHTML=h;
  $('dbody').querySelectorAll('.ditem').forEach(b=>b.onclick=()=>{
    S.cat=b.dataset.c;sv(LSC,S.cat);S.pos=0;buildList();renderCatBtn();render();closeDrawer();
  });
}
function openDrawer(){renderDrawer();$('drawer').classList.add('open');$('mask').classList.add('show')}
function closeDrawer(){$('drawer').classList.remove('open');$('mask').classList.remove('show')}
$('catBtn').onclick=openDrawer;
$('drawerClose').onclick=closeDrawer;
$('mask').onclick=closeDrawer;

/* ---------- 灯箱 ---------- */
function openLb(src){$('lbImg').src=src;$('lbImg').classList.remove('raw');$('lb').classList.add('show')}
function closeLb(){$('lb').classList.remove('show');$('lbImg').src=''}
$('lb').addEventListener('click',e=>{
  if(e.target && e.target.id==='lbImg') e.target.classList.toggle('raw');
  else closeLb();
});
$('md').addEventListener('click',e=>{
  if(e.target && e.target.tagName==='IMG' && !e.target.classList.contains('imgerr')) openLb(e.target.src);
});

const FILTERS=[['all','全部'],['unknown','不会的'],['fresh','未标记'],['known','已会']];
function renderFilters(){
  let h='';
  FILTERS.forEach(f=>{h+='<button class="tbtn'+(S.filter===f[0]?' on':'')+'" data-f="'+f[0]+'">'+f[1]+'</button>'});
  $('filters').innerHTML=h;
  $('filters').querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>{
    S.filter=b.dataset.f;sv(LSF,S.filter);S.pos=0;buildList();renderFilters();render();
  });
  $('shuffleBtn').classList.toggle('on',S.shuffle);
}

/* ---------- 渲染 ---------- */
function render(){
  const total=S.list.length;
  $('cnt').textContent=total;$('tot').textContent=DATA.length;
  let kn=0,un=0;DATA.forEach(d=>{if(marks[d.id]==='k')kn++;else if(marks[d.id]==='u')un++});
  $('kn').textContent=kn;$('un').textContent=un;
  $('pbfill').style.width=(DATA.length?(kn+un)/DATA.length*100:0)+'%';

  if(!total){
    $('card').style.display='none';
    $('emptyTip').classList.remove('hide');
    $('emptyTip').innerHTML = S.kw
      ? '<b>∅</b>当前范围没有命中「'+esc(S.kw)+'」<br>换个分类，或清除搜索再试'
      : '<b>∅</b>没有匹配的题目<br>换个分类或关键词试试';
    $('prevBtn').disabled=$('nextBtn').disabled=$('randBtn').disabled=true;
    $('okBtn').disabled=$('noBtn').disabled=true;
    updateSearchTip();
    return;
  }
  $('card').style.display='flex';
  $('emptyTip').classList.add('hide');
  $('prevBtn').disabled=$('nextBtn').disabled=$('randBtn').disabled=false;
  $('okBtn').disabled=$('noBtn').disabled=false;

  const d=DATA[idxAt(S.pos)];
  $('cur').textContent=S.pos+1;
  $('badge').textContent=catLabel(d.cat);
  $('src').textContent=(d.src && d.src!==catLabel(d.cat))?d.src:'';
  $('q').textContent=d.q;
  const f=marks[d.id];
  $('qflag').innerHTML = f?('<span class="'+(f==='k'?'k':'u')+'">'+(f==='k'?'已掌握':'待攻克')+'</span>'):'';
  $('okBtn').classList.toggle('on',f==='k');
  $('noBtn').classList.toggle('on',f==='u');

  S.revealed=false;S.full=false;
  $('ans').classList.remove('show');
  $('revealBtn').classList.remove('hide');
  const md=$('md');
  md.innerHTML = d.rest ? md2html(d.brief) : md2html(d.brief||'（暂无内容）');
  md.scrollTop=0;
  if(d.rest){
    $('moreBtn').classList.remove('hide');
    $('moreBtn').innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>展开完整解析 · 约 '+d.rest.length+' 字';
  } else {
    $('moreBtn').classList.add('hide');
  }
  sv(LSP,{cat:S.cat,filter:S.filter,pos:S.pos});
  highlight($('q'),S.kw);
  highlight($('md'),S.kw);
  updateSearchTip();
}
function reveal(){
  S.revealed=true;
  $('revealBtn').classList.add('hide');
  $('ans').classList.add('show');
}
function mark(v){
  const d=DATA[idxAt(S.pos)];if(!d)return;
  if(marks[d.id]===v) delete marks[d.id]; else marks[d.id]=v;
  sv(LSK,marks);
  if(S.filter!=='all'){buildList();if(S.pos>=S.list.length)S.pos=Math.max(0,S.list.length-1);render();return}
  const f=marks[d.id];
  $('qflag').innerHTML = f?('<span class="'+(f==='k'?'k':'u')+'">'+(f==='k'?'已掌握':'待攻克')+'</span>'):'';
  $('okBtn').classList.toggle('on',f==='k');
  $('noBtn').classList.toggle('on',f==='u');
  let kn=0,un=0;DATA.forEach(x=>{if(marks[x.id]==='k')kn++;else if(marks[x.id]==='u')un++});
  $('kn').textContent=kn;$('un').textContent=un;
  $('pbfill').style.width=(DATA.length?(kn+un)/DATA.length*100:0)+'%';
}
function go(delta){
  if(!S.list.length)return;
  S.pos=(S.pos+delta+S.list.length)%S.list.length;
  render();
}
function jump(p){S.pos=p;render()}

/* ---------- 事件 ---------- */
$('revealBtn').onclick=reveal;
$('moreBtn').onclick=()=>{
  const d=DATA[idxAt(S.pos)];
  $('md').innerHTML=md2html(d.brief+'\n\n'+d.rest);
  highlight($('md'),S.kw);
  $('moreBtn').classList.add('hide');S.full=true;
};
$('prevBtn').onclick=()=>go(-1);
$('nextBtn').onclick=()=>go(1);
$('randBtn').onclick=()=>{
  if(S.list.length<2)return;
  let p;do{p=Math.floor(Math.random()*S.list.length)}while(p===S.pos);
  jump(p);
};
$('okBtn').onclick=()=>mark('k');
$('noBtn').onclick=()=>mark('u');
$('shuffleBtn').onclick=()=>{S.shuffle=!S.shuffle;sv(LSS,S.shuffle);S.pos=0;buildList();renderFilters();render()};

let tmr=null, composing=false;
function doSearch(v){
  clearTimeout(tmr);
  tmr=setTimeout(()=>{S.kw=(v||'').trim();S.pos=0;buildList();render()},200);
}
/* 中文/日文输入法组字期间不搜索，避免拿拼音去匹配 */
$('kw').addEventListener('compositionstart',()=>{composing=true});
$('kw').addEventListener('compositionend',e=>{composing=false;doSearch(e.target.value)});
$('kw').addEventListener('input',e=>{if(composing)return;doSearch(e.target.value)});
$('kwClear').onclick=()=>{$('kw').value='';S.kw='';S.pos=0;buildList();render()};

/* 滑动切换（抽屉/灯箱打开时不触发） */
let tx=0,ty=0,tt=0;
document.addEventListener('touchstart',e=>{
  if(e.target.closest('.mdbody'))return;
  if($('drawer').classList.contains('open')||$('lb').classList.contains('show'))return;
  tx=e.touches[0].clientX;ty=e.touches[0].clientY;tt=Date.now();
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!tx)return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Date.now()-tt<600&&Math.abs(dx)>58&&Math.abs(dy)<50&&Math.abs(dx)>Math.abs(dy)) go(dx<0?1:-1);
  tx=0;
},{passive:true});

/* 键盘 */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Escape'){closeDrawer();closeLb();return}
  if(e.key==='ArrowRight')go(1);
  else if(e.key==='ArrowLeft')go(-1);
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!S.revealed)reveal();else go(1)}
  else if(e.key==='1')mark('k');
  else if(e.key==='2')mark('u');
});

/* ---------- 题库已由上方 <script src="data.js"> 同步加载，无需异步逻辑 ---------- */

/* ---------- 启动 ---------- */
function start(){
  const b=$('bootOv'); if(b){ b.classList.add('done'); setTimeout(()=>{ if(b.remove)b.remove(); else b.style.display='none'; },260); }
  $('shuffleBtn').innerHTML=SHUF;
  renderCatBtn();renderFilters();buildList();
  const last=ld(LSP,null);
  if(last&&last.cat===S.cat&&last.filter===S.filter&&last.pos<S.list.length) S.pos=last.pos;
  render();
}
if(DATA && DATA.length){ start(); }
else {
  const ov=$('bootOv');
  const t=ov&&ov.querySelector('.boot-title'), s=ov&&ov.querySelector('.boot-sub'), r=ov&&ov.querySelector('.boot-retry');
  if(t) t.textContent='题库加载失败';
  if(s) s.textContent=window.__BGB_ERR__ ? '未找到 data.js（请确认同目录有 data.js 文件）' : '题库为空，请重新构建';
  if(r) r.classList.add('hide');
  console.error('DATA 未加载', window.__BGB_ERR__);
}
</script>
</body>
</html>
