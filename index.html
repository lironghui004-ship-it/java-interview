<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f0e8">
<title>7+1股刷题</title>
<!-- 自托管霞鹜文楷子集（含英文数字，手机/电脑同一款字） -->
<style>@font-face{font-family:"LXGW WenKai";src:url("fonts/lxgw-wenkai-web.woff2") format("woff2");font-display:swap}</style>
<style>
/* ================= Sketch Style · 铅笔手绘风 ================= */
:root{
  /* 纸张 & 铅笔 */
  --paper:#f5f0e8;      /* 纸张米色（主背景） */
  --paper-2:#e8e2d8;    /* 纸张暗部 */
  --paper-3:#faf5ed;    /* 卡片/输入框纸面 */
  --ink:#2c2c2c;        /* 铅笔灰（主色） */
  --ink-2:#5a5a5a;      /* 次级文字 */
  --ink-3:#6b6b6b;      /* 弱化文字（仍满足 AA） */
  --bd:#2c2c2c;         /* 手绘线框 */
  --ok:#1e7a45;         /* 低饱和绿（深，保证文字 AA） */
  --no:#b03a2e;         /* 低饱和红（深） */
  --blue:#1f6fa8;       /* 低饱和蓝 */
  --mark:rgba(243,156,18,.34);
  --code-bg:#2c2c2c; --code-text:#f0e9dc; --code-bd:rgba(240,233,220,.55);

  /* 纹理 */
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.86' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23p)' opacity='0.55'/></svg>");
  --hatch:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='6' height='6'><path d='M0 6L6 0M-1.5 1.5L1.5 -1.5M4.5 7.5L7.5 4.5' stroke='%232c2c2c' stroke-width='1' opacity='.32'/></svg>");
  --wave:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='7'><path d='M0 5 Q 6 1 12 5 T 24 5' fill='none' stroke='%232c2c2c' stroke-width='1.6' stroke-linecap='round'/></svg>");

  /* 交叉线条阴影 */
  --s1:1px 1px 0 rgba(44,44,44,.22);
  --s2:2px 2px 0 rgba(44,44,44,.22);
  --s3:3px 3px 0 rgba(44,44,44,.22);

  /* 手写 / 衬线字体栈：优先霞鹜文楷，回落系统楷体、宋体、衬线 */
  --font-hand:"LXGW WenKai","LXGW WenKai Lite","霞鹜文楷","Kaiti SC",KaiTi,STKaiti,"楷体","Songti SC",SimSun,Georgia,"Times New Roman",serif;
  /* 端正印刷体（题目/答案）：以宋体为主，避免手写体笔锋导致的"不端正" */
  --font-plain:"Songti SC","Noto Serif SC","STSong","SimSun",Georgia,"Times New Roman",serif;
}
[data-theme="dark"]{  /* 夜间：石墨纸 */
  --paper:#2b2924; --paper-2:#343029; --paper-3:#3a352d;
  --ink:#ece4d4; --ink-2:#c6bda9; --ink-3:#a89e8a; --bd:#d9cfb8;
  --ok:#7fc99c; --no:#e2907f; --blue:#9ec8e8;
  --mark:rgba(220,185,107,.26);
  --code-bg:#1e1c18; --code-text:#ece4d4; --code-bd:rgba(236,228,212,.45);
  --hatch:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='6' height='6'><path d='M0 6L6 0M-1.5 1.5L1.5 -1.5M4.5 7.5L7.5 4.5' stroke='%23ece4d4' stroke-width='1' opacity='.26'/></svg>");
  --wave:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='7'><path d='M0 5 Q 6 1 12 5 T 24 5' fill='none' stroke='%23ece4d4' stroke-width='1.6' stroke-linecap='round'/></svg>");
  --s1:1px 1px 0 rgba(236,228,212,.26);
  --s2:2px 2px 0 rgba(236,228,212,.26);
  --s3:3px 3px 0 rgba(236,228,212,.26);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:var(--font-hand);font-size:16px;line-height:1.7;
  background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
}
body::before{ /* 纸张颗粒纹理 */
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:var(--grain);background-repeat:repeat;
  opacity:.30;mix-blend-mode:multiply;
}
[data-theme="dark"] body::before{opacity:.14;mix-blend-mode:screen}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;font-size:16px}
input{font-family:inherit}
:focus-visible{outline:2px dashed var(--bd);outline-offset:2px}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;max-width:780px;margin:0 auto;width:100%}

/* ---------- header ---------- */
header{padding:18px 22px 8px;display:flex;align-items:flex-start;gap:12px}
.brand{flex:1;min-width:0}
.brand h1{
  margin:0;display:inline-block;font-size:22px;font-weight:700;letter-spacing:1px;font-style:italic;
  transform:rotate(-1deg);
}
.brand .stat{margin-top:10px;font-size:13px;color:var(--ink-2);letter-spacing:.3px}
.brand .stat b{color:var(--ink);font-weight:700}
.iconbtn{width:44px;height:44px;flex:none;display:grid;place-items:center;
  background:var(--paper-3);border:1.5px dashed rgba(44,44,44,.42);box-shadow:var(--s2);
  transition:background-color .12s steps(2),color .12s,box-shadow .1s,transform .06s}
.iconbtn:nth-of-type(even){transform:rotate(1.4deg)}
.iconbtn.on{background:var(--ink);color:var(--paper);box-shadow:var(--s1)}
.iconbtn:active{box-shadow:none;transform:rotate(-2deg) translateY(1px)}
@media (hover:hover){.iconbtn:hover{background:var(--ink);color:var(--paper);box-shadow:var(--s1)}}

/* ---------- 分类按钮 ---------- */
.catbtn{display:flex;align-items:center;gap:9px;margin:16px 22px 0;min-height:48px;padding:0 17px;
  background:var(--paper-3);border:1.5px dashed rgba(44,44,44,.42);box-shadow:var(--s2);
  font-size:16px;font-weight:700;flex:none;transform:rotate(-.7deg);
  transition:background-color .12s steps(2),color .12s,box-shadow .1s,transform .06s}
.catbtn:active{box-shadow:none;transform:rotate(.5deg) translate(1px,2px)}
@media (hover:hover){.catbtn:hover{background:var(--ink);color:var(--paper);box-shadow:var(--s1)}}
.catbtn .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.catbtn .cc{font-size:12.5px;color:var(--ink-2);font-weight:400;flex:none}
@media (hover:hover){.catbtn:hover .cc{color:var(--paper)}}
.pbar{height:9px;background:var(--paper-2);border:1.5px dashed rgba(44,44,44,.32);margin:14px 22px 0;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background-image:var(--hatch);background-repeat:repeat;
  transition:width .3s steps(14)}

/* ---------- 左侧抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(44,44,44,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(82vw,330px);background:var(--paper);z-index:70;
  transform:translateX(-104%);transition:transform .22s steps(9);
  display:flex;flex-direction:column;border-right:2px dashed var(--bd);
  box-shadow:6px 0 0 rgba(44,44,44,.16);padding-top:env(safe-area-inset-top)}
.drawer.open{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:18px 14px 10px 22px;flex:none}
.dhead b{font-size:17px;letter-spacing:1px;font-weight:700;transform:rotate(-1deg);display:inline-block;
  padding-bottom:5px;background-image:var(--wave);background-repeat:repeat-x;background-position:left bottom;background-size:24px 7px}
.dclose{width:40px;height:40px;display:grid;place-items:center;color:var(--ink-2);
  background:var(--paper-3);border:2px dashed var(--bd);box-shadow:var(--s1);transform:rotate(2deg)}
.dclose:active{transform:rotate(-2deg) translateY(1px);box-shadow:none}
.dbody{flex:1;overflow-y:auto;padding:0 12px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.dbody::-webkit-scrollbar{width:0}
.dsec{padding:16px 12px 6px;font-size:12px;color:var(--ink-3);letter-spacing:2px;font-weight:700}
.ditem{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  padding:14px 16px;font-size:15.5px;min-height:50px;color:var(--ink);text-align:left;line-height:1.35;
  border:2px dashed transparent;background:transparent;
  transition:background-color .12s steps(2),border-color .12s,transform .06s}
.ditem .n{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.ditem.on{background:var(--paper-2);border-color:var(--bd);font-weight:700}
.ditem.on .n{color:var(--ink-2)}
.ditem.on span:first-child::before{content:'✎ ';}
.ditem:active{background:var(--paper-2);transform:translate(1px,1px)}
@media (hover:hover){.ditem:hover{background:var(--paper-2)}}
.dfoot{padding:16px 22px 24px;font-size:12px;line-height:1.8;color:var(--ink-3);border-top:2px dashed var(--bd);margin-top:14px}

/* ---------- 图片灯箱 ---------- */
.lb{position:fixed;inset:0;z-index:80;background:rgba(26,24,20,.96);display:none;flex-direction:column}
.lb.show{display:flex}
.lb-in{flex:1;overflow:auto;display:flex;-webkit-overflow-scrolling:touch}
.lb-in img{margin:auto;max-width:100%;max-height:100%;touch-action:pan-x pan-y;border:2px dashed rgba(240,233,220,.5)}
.lb-in img.raw{max-width:none;max-height:none}
.lb-tip{flex:none;text-align:center;color:#d8cfbc;font-size:12.5px;
  padding:10px 0 calc(10px + env(safe-area-inset-bottom))}

/* ---------- 工具行 ---------- */
.tools{display:flex;gap:12px;padding:16px 22px 10px;align-items:center;flex:none;flex-wrap:wrap}
.search{flex:1 1 180px;position:relative;min-width:150px}
.filters{flex:0 1 auto;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.search input{width:100%;height:44px;padding:0 40px 0 40px;border:2px dashed var(--bd);
  background:var(--paper-3);color:var(--ink);font-size:15px;outline:none;box-shadow:var(--s1);
  transition:box-shadow .12s steps(2),background-color .12s}
.search input:focus{box-shadow:var(--s2);background:var(--paper-3)}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{display:none}
.search svg{position:absolute;left:13px;top:14px;opacity:.55}
.sclear{position:absolute;right:5px;top:5px;width:34px;height:34px;display:grid;place-items:center;
  color:var(--ink-2);background:var(--paper-2);border:2px dashed var(--bd);transform:rotate(3deg)}
.sclear.hide{display:none}
.sclear:active{transform:rotate(-4deg) translateY(1px)}
@media (hover:hover){.sclear:hover{background:var(--ink);color:var(--paper)}}
.sTip{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:6px 22px 4px;
  font-size:12.5px;color:var(--ink-2);flex:none}
.sTip.hide{display:none}
.sTip b{color:var(--ink);font-weight:700}
.sTip button{font-size:12.5px;color:var(--blue);text-decoration:underline;text-decoration-style:wavy;text-underline-offset:3px}
mark{background:var(--mark);color:var(--ink);padding:0 2px;border-bottom:2px dashed var(--bd)}
.tbtn{flex:none;min-height:42px;padding:0 14px;background:var(--paper-3);border:1.5px dashed rgba(44,44,44,.42);
  font-size:13.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;box-shadow:var(--s1);
  transition:background-color .12s steps(2),color .12s,box-shadow .1s,transform .06s}
.tbtn.on{background:var(--ink);color:var(--paper);font-weight:700}
.tbtn:active{box-shadow:none;transform:translate(1px,2px)}
@media (hover:hover){.tbtn:hover{background:var(--ink);color:var(--paper)}}

/* ---------- 卡片 ---------- */
main{flex:1;min-height:0;padding:18px 22px 8px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.card{position:relative;background:var(--paper-3);border:1.5px dashed rgba(44,44,44,.34);box-shadow:var(--s1);
  width:100%;display:flex;flex-direction:column;min-height:0;margin-bottom:22px}
.cmeta{display:flex;align-items:center;gap:12px;padding:22px 24px 2px;flex:none}
.badge{font-size:12.5px;padding:5px 12px;background:var(--paper-2);color:var(--ink);font-weight:700;
  border:1.5px dashed rgba(44,44,44,.4);box-shadow:var(--s1);transform:rotate(-1.6deg)}
.dot{width:5px;height:5px;flex:none;background:var(--ink-3);transform:rotate(45deg)}
.prog{margin-left:auto;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.prog b{color:var(--ink);font-size:15px;font-weight:700}

.qwrap{padding:28px 26px 30px;flex:none}
.q{font-size:22px;line-height:1.68;font-weight:700;margin:0;letter-spacing:.2px;word-break:break-word;
  padding-bottom:6px;font-family:var(--font-plain)}
.qflag{margin-top:20px;font-size:12.5px;display:flex;gap:8px;align-items:center;min-height:20px}
.qflag span{padding:4px 12px;font-weight:700;border:1.5px dashed rgba(44,44,44,.4);background:var(--paper-2)}
.qflag .k{color:var(--ok)}
.qflag .u{color:var(--no)}

.markRow{display:none;gap:14px;padding:0 24px 22px;flex:none}
.markRow.show{display:flex}
.markRow button{flex:1;min-height:42px;background:var(--paper-3);border:1.5px dashed rgba(44,44,44,.42);box-shadow:var(--s1);
  font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background-color .12s steps(2),color .12s,box-shadow .1s,transform .06s}
.markRow .ok{color:var(--ok)}
.markRow .no{color:var(--no)}
.markRow .ok.on{background:var(--ok);color:var(--paper);border-style:solid}
.markRow .no.on{background:var(--no);color:var(--paper);border-style:solid}
.markRow button:active{box-shadow:none;transform:translate(1px,2px)}
@media (hover:hover){
  .markRow .ok:hover{background:var(--ok);color:var(--paper)}
  .markRow .no:hover{background:var(--no);color:var(--paper)}
}

.reveal{margin:0 24px 10px;min-height:62px;background:var(--ink);color:var(--paper);
  font-size:18.5px;font-weight:700;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:10px;
  border:1.5px dashed var(--bd);box-shadow:var(--s3);flex:none;transform:rotate(-.5deg);position:relative;
  transition:box-shadow .12s steps(2),transform .06s,letter-spacing .18s}
.reveal .arrow{display:inline-block;transition:transform .18s steps(4)}
.reveal:active{box-shadow:var(--s1);transform:rotate(1deg) translateY(2px)}
.reveal.hide{display:none}
@media (hover:hover){.reveal:hover{box-shadow:var(--s3);transform:rotate(.6deg);letter-spacing:3px}
  .reveal:hover .arrow{transform:translateY(3px)}}

.ans{flex:none;display:none;flex-direction:column;border-top:1px solid rgba(44,44,44,.26);margin-top:22px;position:relative}
.ans.show{display:flex}
.ans::before{content:'✎  答 案';display:block;flex:none;
  margin:0 26px;padding:16px 0 12px;font-size:14px;font-weight:700;letter-spacing:3px;
  color:var(--ink);border-bottom:1px solid rgba(44,44,44,.26)}
.mdbody{padding:26px 30px 48px;
  font-size:16px;line-height:1.92;color:var(--ink);max-width:74ch;
  font-family:var(--font-plain)}

/* markdown */
.md h3{font-size:18px;margin:26px 0 14px;font-weight:700;line-height:1.5;padding-bottom:8px;
  background-image:var(--wave);background-repeat:repeat-x;background-position:left bottom;background-size:28px 8px}
.md h3:first-child{margin-top:0}
.md h4{font-size:16.5px;margin:20px 0 10px;font-weight:700;color:var(--ink);
  text-decoration:underline;text-decoration-style:dashed;text-underline-offset:5px}
.md p{margin:0 0 16px}
.md strong{font-weight:700;box-shadow:inset 0 -.55em 0 var(--mark)}
.md ul,.md ol{margin:0 0 16px;padding-left:24px}
.md ul{list-style:square}
.md li{margin:8px 0}
.md code{background:var(--paper-2);padding:2px 7px;font-size:15.5px;border-bottom:2px dashed var(--bd);
  font-family:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;color:var(--no)}
.md pre{background:var(--code-bg);color:var(--code-text);border:2px dashed var(--code-bd);
  padding:16px 20px;overflow-x:auto;margin:0 0 18px;font-size:15.5px;line-height:1.8;box-shadow:var(--s2);
  font-family:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  -webkit-overflow-scrolling:touch}
.md pre code{background:none;padding:0;border:none;color:inherit;font-size:inherit;line-height:inherit;font-family:inherit}
.md blockquote{margin:0 0 16px;padding:12px 15px;border:2px dashed var(--bd);background:var(--paper-2);
  color:var(--ink-2);font-size:16px}
.md table{border-collapse:collapse;margin:0 0 16px;font-size:14.5px;display:block;overflow-x:auto;white-space:nowrap}
.md th,.md td{border:2px dashed var(--bd);padding:8px 12px;text-align:left}
.md th{background:var(--paper-2);font-weight:700}
.md a{color:var(--blue);text-decoration:underline;text-decoration-style:wavy;text-underline-offset:3px}
.md img{display:block;max-width:100%;height:auto;margin:10px auto 22px}
.md td img{display:inline-block;max-width:180px;vertical-align:middle;margin:0}
.md img.imgerr{min-height:64px;padding:20px 10px;font-size:12px;color:var(--ink-3)}

.more{margin:0 24px 16px;min-height:44px;border:1.5px dashed rgba(44,44,44,.42);background:var(--paper-3);
  color:var(--ink-2);font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;
  flex:none;box-shadow:var(--s1);transform:rotate(-.4deg);
  transition:background-color .12s steps(2),color .12s,box-shadow .1s,transform .06s}
.more:active{box-shadow:none;transform:rotate(.8deg) translate(1px,2px)}
.more.hide{display:none}
@media (hover:hover){.more:hover{background:var(--ink);color:var(--paper)}}

/* 底部固定操作 */
.bar{display:flex;gap:16px;padding:14px 22px calc(16px + env(safe-area-inset-bottom));flex:none}
.bar button{min-height:46px;background:var(--paper-3);border:1.5px dashed rgba(44,44,44,.42);box-shadow:var(--s2);
  display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:700;
  transition:background-color .12s steps(2),color .12s,box-shadow .1s,transform .06s}
.bar .n{flex:1}
.bar .r{width:62px;flex:none}
.bar button:active{box-shadow:var(--s1);transform:translateY(2px)}
.bar button:disabled{opacity:.42}
@media (hover:hover){.bar button:not(:disabled):hover{background:var(--ink);color:var(--paper);box-shadow:var(--s1)}}

/* 返回顶部：纯符号无框无底，半透明浮现，悬停加深 */
.topbtn{position:fixed;right:20px;bottom:94px;width:54px;height:54px;z-index:50;
  display:grid;place-items:center;color:var(--ink);padding:0;
  background:none;border:none;box-shadow:none;
  transition:opacity .25s ease,transform .06s;
  opacity:0;pointer-events:none}
.topbtn.show{opacity:.66;pointer-events:auto}
.topbtn:active{transform:translateY(2px);opacity:.95}
@media (hover:hover){.topbtn:hover{opacity:1}}

/* 空状态 */
.empty{margin:auto;text-align:center;color:var(--ink-2);font-size:15px;line-height:2;padding:24px}
.empty b{display:grid;place-items:center;width:86px;height:86px;margin:0 auto 14px;font-size:36px;
  font-weight:400;border:2px dashed var(--bd);box-shadow:var(--s2);transform:rotate(-6deg)}
.empty.hide{display:none}

@media (max-width:360px){
  .q{font-size:20px}
  .bar button{font-size:14px}
  .catbtn{font-size:14.5px}
  .search{flex:1 1 100%}
}

/* 启动遮罩 */
.boot{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:var(--paper);padding:24px}
.boot.done{opacity:0;pointer-events:none;transition:opacity .2s steps(4)}
.boot-box{width:100%;max-width:320px;text-align:center;background:var(--paper-3);
  border:2px dashed var(--bd);box-shadow:var(--s3);padding:24px 20px;transform:rotate(-.8deg)}
.boot-spin{width:34px;height:34px;margin:0 auto 16px;border:2px dashed var(--bd);
  border-top:2px solid var(--ink);animation:bspin 1.1s steps(8) infinite}
@keyframes bspin{to{transform:rotate(360deg)}}
.boot-title{font-size:15.5px;font-weight:700;color:var(--ink);margin-bottom:14px}

    transition-duration:.001ms !important}

<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>7+1股刷题</h1>
      <div class="stat">已掌握 <b id="kn">0</b> / <span id="tot">0</span> · 待攻克 <b id="un">0</b></div>
    </div>
    <button class="iconbtn" id="shuffleBtn" aria-label="乱序模式" title="乱序模式"></button>
    <button class="iconbtn" id="themeBtn" aria-label="切换主题"></button>
  </header>

  <button class="catbtn" id="catBtn" aria-label="选择分类">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>

    <span class="cc" id="catNum"></span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="opacity:.45"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <div class="pbar"><i id="pbfill"></i></div>

  <div class="tools">

      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="kw" type="search" placeholder="搜题面…" autocomplete="off">
      <button class="sclear hide" id="kwClear" aria-label="清空搜索"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>

  <main id="stage">
    <div class="card" id="card">
      <div class="cmeta">
        <span class="badge" id="badge">Java基础</span>
        <span class="dot"></span>

      <div class="qwrap">
        <h2 class="q" id="q"></h2>

      </div>
      <div class="markRow show" id="markRow">
        <button id="okBtn" class="ok"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>会了</button>
        <button id="noBtn" class="no"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>不会</button>
      </div>
      <button class="reveal" id="revealBtn">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        看 看 答 案
        <span class="arrow" aria-hidden="true">↓</span>

      <div class="ans" id="ans">
        <div class="mdbody md" id="md"></div>

    <div class="empty hide" id="emptyTip"><b>∅</b>没有匹配的题目<br>换个分类或关键词试试</div>

  <div class="bar">
    <button class="n" id="prevBtn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>上一题</button>
    <button class="r" id="randBtn" title="随机跳题">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="n" id="nextBtn">下一题<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <button class="topbtn" id="topBtn" aria-label="返回顶部" title="返回顶部">
    <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 11 12 6 7 11"/><polyline points="17 18 12 13 7 18"/></svg>
  </button>
</div>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="dhead">
    <b>选择分类</b>
    <button class="dclose" id="drawerClose" aria-label="关闭"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>

<div class="lb" id="lb">
  <div class="lb-in" id="lbIn"><img id="lbImg" alt=""></div>
  <div class="lb-tip">单击图片切换 适应/原图 · 点空白处关闭</div>
</div>

<div class="boot" id="bootOv">
  <div class="boot-box">
    <div class="boot-spin"></div>
    <div class="boot-title" id="bootTitle">正在加载题库</div>
    <div class="boot-bar"><i id="bootBar"></i></div>
    <div class="boot-sub" id="bootSub">首次加载约 1.5MB，之后秒开</div>
    <button class="boot-retry hide" id="bootRetry">重试</button>
  </div>
</div>

<script src="data.js" onerror="window.__BGB_ERR__=1"></script>
<script>
let DATA = (typeof window!=='undefined' && window.__BGB_DATA__) || null;
const CATS = ['Java基础','多线程','JVM','MySQL','Redis','Spring','MQ'];
const PRIMARY_DIRS = ['Java基础','集合类','Java并发','JVM','MySQL','Redis','Spring','SpringCloud','Kafka','RocketMQ','RabbitMQ'];

/* ---------- 存储 ---------- */
const LSK='bgb_marks', LST='bgb_theme', LSC='bgb_cat', LSS='bgb_shuffle', LSF='bgb_filter', LSP='bgb_pos';
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let marks=ld(LSK,{});
/* 卡片标识：优先 id，无 id（OSS 数据壳）退化为唯一题面 q */
const cid=d=>{const i=d&&d.id;return (i!==undefined&&i!==null&&i!=='')?i:d.q};
if(marks['undefined']){delete marks['undefined'];sv(LSK,marks)}

/* ---------- 状态 ---------- */
const S={cat:ld(LSC,'all'), kw:'', filter:ld(LSF,'all'), shuffle:ld(LSS,false), list:[], pos:0, order:null, revealed:false, full:false};

/* ---------- 分类统计 ---------- */
const catCount={};
DATA.forEach(d=>catCount[d.cat]=(catCount[d.cat]||0)+1);
const srcCount={};
DATA.forEach(d=>(d.srcs||[]).forEach(s=>srcCount[s]=(srcCount[s]||0)+1));
const EXTRA_CATS=[...new Set(DATA.flatMap(d=>d.srcs||[]))]
  .filter(s=>PRIMARY_DIRS.indexOf(s)<0 && CATS.indexOf(s)<0)
  .sort((a,b)=>(srcCount[b]||0)-(srcCount[a]||0));
if(S.cat!=='all'){
  if(S.cat.indexOf('x:')===0){ if(EXTRA_CATS.indexOf(S.cat.slice(2))<0) S.cat='all'; }
  else if(CATS.indexOf(S.cat)<0) S.cat='all';
}
function catLabel(c){return c==='all'?'全部':(c.indexOf('x:')===0?c.slice(2):c)}
function catNum(c){
  if(c==='all') return DATA.length;
  return c.indexOf('x:')===0 ? (srcCount[c.slice(2)]||0) : (catCount[c]||0);
}

/* ---------- 主题 ---------- */
const SUN='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const SHUF='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>';
const MOON='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12.8A8.5 8.5 0 1111.2 3a6.6 6.6 0 009.8 9.8z"/></svg>';
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeBtn').innerHTML = t==='dark'?SUN:MOON;
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content', t==='dark'?'#2b2924':'#f5f0e8');
  sv(LST,t);
}
setTheme(ld(LST, null) || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
document.getElementById('themeBtn').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');

/* ---------- mini markdown ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){
  s=esc(s);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,alt,src)=>
    '<img src="'+src+'" alt="'+alt+'" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.classList.add(\'imgerr\')">');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*\*([^*]+)\*\*\*/g,'<strong><em>$1</em></strong>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  s=s.replace(/\*{2,}/g,'');  // 清理未配对的加粗标记
  return s;
}
function md2html(src){
  const blocks=[];
  src=src.replace(/```(\w*)[ \t]*(?:\n|$)([\s\S]*?)(?:```|$)/g,(m,lang,code)=>{
    blocks.push('<pre><code>'+esc(code.replace(/\n$/,''))+'</code></pre>');
    return '%%BLK'+(blocks.length-1)+'%%';
  });
  const lines=src.split('\n');
  let out=[],p=[],list=null,quote=[],tbl=null;
  const flushP=()=>{if(p.length){out.push('<p>'+inline(p.join(' ')).replace(/\n/g,'<br>')+'</p>');p=[]}};
  const flushList=()=>{
    if(list){out.push('<'+list.t+'>'+list.items.map(i=>'<li>'+inline(i)+'</li>').join('')+'</'+list.t+'>');list=null}
  };
  const flushQuote=()=>{if(quote.length){out.push('<blockquote>'+inline(quote.join(' '))+'</blockquote>');quote=[]}};
  const flushTbl=()=>{
    if(tbl){
      let h='<table><thead><tr>'+tbl.head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
      tbl.rows.forEach(r=>h+='<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>');
      out.push(h+'</tbody></table>');tbl=null;
    }
  };
  const flushAll=()=>{flushP();flushList();flushQuote();flushTbl()};
  for(let i=0;i<lines.length;i++){
    let ln=lines[i];
    let m;
    if(ln.indexOf('%%BLK')>=0){flushAll();out.push(ln.replace(/%%BLK(\d+)%%/g,(s,d)=>blocks[+d]));continue}
    if(!ln.trim()){flushAll();continue}
    if(m=ln.match(/^[ \t]*!\[[^\]]*\]\([^)]+\)[ \t]*$/)){flushAll();out.push(inline(ln.trim()));continue}
    if(m=ln.match(/^(#{1,6})\s+(.*)$/)){
      flushAll();const lv=Math.min(+m[1].length+1,4);
      out.push('<h'+lv+'>'+inline(m[2].trim())+'</h'+lv+'>');continue;
    }
    if(/^\s*\|.*\|\s*$/.test(ln)){
      flushP();flushList();flushQuote();
      const cells=ln.trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim());
      if(/^[\s:-]+$/.test(cells.join(''))&&cells.every(c=>c.indexOf('-')>=0)) continue;
      if(!tbl){tbl={head:cells,rows:[]}}else{tbl.rows.push(cells)}
      continue;
    } else flushTbl();
    if(m=ln.match(/^\s*>\s?(.*)$/)){flushP();flushList();quote.push(m[1]);continue} else flushQuote();
    if(m=ln.match(/^\s*[-*+]\s+(.*)$/)){
      flushP();flushQuote();
      if(!list||list.t!=='ul'){flushList();list={t:'ul',items:[]}}
      list.items.push(m[1]);continue;
    }
    if(m=ln.match(/^\s*\d+[.)]\s+(.*)$/)){
      flushP();flushQuote();
      if(!list||list.t!=='ol'){flushList();list={t:'ol',items:[]}}
      list.items.push(m[1]);continue;
    } else flushList();
    p.push(ln);
  }
  flushAll();
  return out.join('');
}

/* ---------- 构建列表 ---------- */
function buildList(){
  let arr=[];
  for(let i=0;i<DATA.length;i++){
    const d=DATA[i];
    if(S.cat!=='all'){
      if(S.cat.indexOf('x:')===0){
        if(!(d.srcs||[]).includes(S.cat.slice(2))) continue;
      } else if(d.cat!==S.cat) continue;
    }
    const f=marks[cid(d)];
    if(S.filter==='unknown'&&f!=='u') continue;
    if(S.filter==='known'&&f!=='k') continue;
    if(S.filter==='fresh'&&f) continue;
    if(S.kw){
      const k=S.kw.toLowerCase();
      if((d.q||'').toLowerCase().indexOf(k)<0) continue;
    }
    arr.push(i);
  }
  S.list=arr;
  if(S.shuffle) S.order=shuffled(arr.length); else S.order=null;
  if(S.pos>=arr.length) S.pos=0;
}
function shuffled(n){const a=[];for(let i=0;i<n;i++)a.push(i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const idxAt=p=>S.list[S.order?S.order[p]:p];

/* ---------- 搜索辅助 ---------- */
let kwAllCache={kw:'',n:0};
function countAll(kw){
  if(kwAllCache.kw===kw) return kwAllCache.n;
  const k=kw.toLowerCase();
  let n=0;
  for(let i=0;i<DATA.length;i++){
    const d=DATA[i];
    if((d.q||'').toLowerCase().indexOf(k)>=0) n++;
  }
  kwAllCache={kw:kw,n:n};
  return n;
}
function highlight(root,kw){
  if(!kw||!root||typeof document.createTreeWalker!=='function') return;
  try{
    const k=kw.toLowerCase();
    const w=document.createTreeWalker(root,4,null);
    const nodes=[];
    while(w.nextNode()) nodes.push(w.currentNode);
    for(let i=0;i<nodes.length;i++){
      const n=nodes[i], txt=n.nodeValue, low=txt.toLowerCase();
      if(low.indexOf(k)<0) continue;
      const frag=document.createDocumentFragment();
      let pos=0,j=low.indexOf(k);
      while(j>=0){
        if(j>pos) frag.appendChild(document.createTextNode(txt.slice(pos,j)));
        const mk=document.createElement('mark');
        mk.textContent=txt.substr(j,kw.length);
        frag.appendChild(mk);
        pos=j+kw.length; j=low.indexOf(k,pos);
      }
      if(pos<txt.length) frag.appendChild(document.createTextNode(txt.slice(pos)));
      if(n.parentNode) n.parentNode.replaceChild(frag,n);
    }
  }catch(e){}
}
function updateSearchTip(){
  const tip=$('sTip');
  if(!S.kw){tip.classList.add('hide');$('kwClear').classList.add('hide');return}
  $('kwClear').classList.remove('hide');
  const all=countAll(S.kw), cur=S.list.length;
  tip.classList.remove('hide');
  tip.innerHTML = cur>0
    ? '搜题面「'+esc(S.kw)+'」全库命中 <b>'+all+'</b> 题，当前范围 <b>'+cur+'</b> 题<button id="sClr">清除</button>'
    : (all>0
      ? '搜题面「'+esc(S.kw)+'」当前范围无结果，全库命中 <b>'+all+'</b> 题<button id="sAll">在全部分类里搜</button>'
      : '题面里没搜到「'+esc(S.kw)+'」（只搜题面，不搜解析）<button id="sClr">清除</button>');
  const b=$('sClr')||$('sAll');
  if(b) b.onclick=()=>{
    if(b.id==='sAll'){S.cat='all';sv(LSC,S.cat);renderCatBtn()}
    else{$('kw').value='';S.kw=''}
    S.pos=0;buildList();render();
  };
}

/* ---------- 抽屉 ---------- */
const $=id=>document.getElementById(id);
function renderCatBtn(){
  $('catName').textContent=catLabel(S.cat);
  $('catNum').textContent=catNum(S.cat)+' 题';
}
function renderDrawer(){
  const item=c=>'<button class="ditem'+(S.cat===c?' on':'')+'" data-c="'+c+'"><span>'+catLabel(c)+'</span><span class="n">'+catNum(c)+'</span></button>';
  let h='<div class="dsec">分类</div>'+item('all');
  h+='<div class="dsec">核心主线</div>';
  CATS.forEach(c=>h+=item(c));
  h+='<div class="dsec">更多分类</div>';
  EXTRA_CATS.forEach(c=>h+=item('x:'+c));
  $('dbody').innerHTML=h;
  $('dbody').querySelectorAll('.ditem').forEach(b=>b.onclick=()=>{
    S.cat=b.dataset.c;sv(LSC,S.cat);S.pos=0;buildList();renderCatBtn();render();closeDrawer();
  });
}
function openDrawer(){renderDrawer();$('drawer').classList.add('open');$('mask').classList.add('show')}
function closeDrawer(){$('drawer').classList.remove('open');$('mask').classList.remove('show')}
$('catBtn').onclick=openDrawer;
$('drawerClose').onclick=closeDrawer;
$('mask').onclick=closeDrawer;

/* ---------- 灯箱 ---------- */
function openLb(src){$('lbImg').src=src;$('lbImg').classList.remove('raw');$('lb').classList.add('show')}
function closeLb(){$('lb').classList.remove('show');$('lbImg').src=''}
$('lb').addEventListener('click',e=>{
  if(e.target && e.target.id==='lbImg') e.target.classList.toggle('raw');
  else closeLb();
});
$('md').addEventListener('click',e=>{
  if(e.target && e.target.tagName==='IMG' && !e.target.classList.contains('imgerr')) openLb(e.target.src);
});

const FILTERS=[['all','全部'],['unknown','不会的'],['fresh','未标记'],['known','已会']];
function renderFilters(){
  let h='';
  FILTERS.forEach(f=>{h+='<button class="tbtn'+(S.filter===f[0]?' on':'')+'" data-f="'+f[0]+'">'+f[1]+'</button>'});
  $('filters').innerHTML=h;
  $('filters').querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>{
    S.filter=b.dataset.f;sv(LSF,S.filter);S.pos=0;buildList();renderFilters();render();
  });
  $('shuffleBtn').classList.toggle('on',S.shuffle);
}

/* ---------- 渲染 ---------- */
function render(){
  const total=S.list.length;
  $('cnt').textContent=total;$('tot').textContent=DATA.length;
  let kn=0,un=0;DATA.forEach(d=>{if(marks[cid(d)]==='k')kn++;else if(marks[cid(d)]==='u')un++});
  $('kn').textContent=kn;$('un').textContent=un;
  $('pbfill').style.width=(DATA.length?(kn+un)/DATA.length*100:0)+'%';

  if(!total){
    $('card').style.display='none';
    $('emptyTip').classList.remove('hide');
    $('emptyTip').innerHTML = S.kw
      ? '<b>∅</b>当前范围没有命中「'+esc(S.kw)+'」<br>换个分类，或清除搜索再试'
      : '<b>∅</b>没有匹配的题目<br>换个分类或关键词试试';
    $('prevBtn').disabled=$('nextBtn').disabled=$('randBtn').disabled=true;
    $('okBtn').disabled=$('noBtn').disabled=true;
    updateSearchTip();
    return;
  }
  $('card').style.display='flex';
  $('emptyTip').classList.add('hide');
  $('prevBtn').disabled=$('nextBtn').disabled=$('randBtn').disabled=false;
  $('okBtn').disabled=$('noBtn').disabled=false;

  const d=DATA[idxAt(S.pos)];
  $('cur').textContent=S.pos+1;
  $('badge').textContent=catLabel(d.cat);
  $('src').textContent=(d.src && d.src!==catLabel(d.cat))?d.src:'';
  $('q').textContent=d.q;
  const f=marks[cid(d)];
  $('qflag').innerHTML = f?('<span class="'+(f==='k'?'k':'u')+'">'+(f==='k'?'已掌握':'待攻克')+'</span>'):'';
  $('okBtn').classList.toggle('on',f==='k');
  $('noBtn').classList.toggle('on',f==='u');

  S.revealed=false;S.full=false;
  $('ans').classList.remove('show');
  $('revealBtn').classList.remove('hide');
  const md=$('md');
  md.innerHTML = d.rest ? md2html(d.brief) : md2html(d.brief||'（暂无内容）');
  $('stage').scrollTop=0;
  if(d.rest){
    $('moreBtn').classList.remove('hide');
    $('moreBtn').innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>展开完整解析 · 约 '+d.rest.length+' 字';
  } else {
    $('moreBtn').classList.add('hide');
  }
  sv(LSP,{cat:S.cat,filter:S.filter,pos:S.pos});
  highlight($('q'),S.kw);
  highlight($('md'),S.kw);
  updateSearchTip();
}
function reveal(){
  S.revealed=true;
  $('revealBtn').classList.add('hide');
  $('ans').classList.add('show');
}
function mark(v){
  const d=DATA[idxAt(S.pos)];if(!d)return;
  if(marks[cid(d)]===v) delete marks[cid(d)]; else marks[cid(d)]=v;
  sv(LSK,marks);
  if(S.filter!=='all'){buildList();if(S.pos>=S.list.length)S.pos=Math.max(0,S.list.length-1);render();return}
  const f=marks[cid(d)];
  $('qflag').innerHTML = f?('<span class="'+(f==='k'?'k':'u')+'">'+(f==='k'?'已掌握':'待攻克')+'</span>'):'';
  $('okBtn').classList.toggle('on',f==='k');
  $('noBtn').classList.toggle('on',f==='u');
  let kn=0,un=0;DATA.forEach(x=>{if(marks[cid(x)]==='k')kn++;else if(marks[cid(x)]==='u')un++});
  $('kn').textContent=kn;$('un').textContent=un;
  $('pbfill').style.width=(DATA.length?(kn+un)/DATA.length*100:0)+'%';
}
function go(delta){
  if(!S.list.length)return;
  S.pos=(S.pos+delta+S.list.length)%S.list.length;
  render();
}
function jump(p){S.pos=p;render()}

/* ---------- 事件 ---------- */
$('revealBtn').onclick=reveal;
$('moreBtn').onclick=()=>{
  const d=DATA[idxAt(S.pos)];
  $('md').innerHTML=md2html(d.brief+'\n\n'+d.rest);
  highlight($('md'),S.kw);
  $('moreBtn').classList.add('hide');S.full=true;
};
$('prevBtn').onclick=()=>go(-1);
$('nextBtn').onclick=()=>go(1);
$('randBtn').onclick=()=>{
  if(S.list.length<2)return;
  let p;do{p=Math.floor(Math.random()*S.list.length)}while(p===S.pos);
  jump(p);
};
$('okBtn').onclick=()=>mark('k');
$('noBtn').onclick=()=>mark('u');
$('shuffleBtn').onclick=()=>{S.shuffle=!S.shuffle;sv(LSS,S.shuffle);S.pos=0;buildList();renderFilters();render()};

let tmr=null, composing=false;
function doSearch(v){
  clearTimeout(tmr);
  tmr=setTimeout(()=>{S.kw=(v||'').trim();S.pos=0;buildList();render()},200);
}
/* 中文/日文输入法组字期间不搜索，避免拿拼音去匹配 */
$('kw').addEventListener('compositionstart',()=>{composing=true});
$('kw').addEventListener('compositionend',e=>{composing=false;doSearch(e.target.value)});
$('kw').addEventListener('input',e=>{if(composing)return;doSearch(e.target.value)});
$('kwClear').onclick=()=>{$('kw').value='';S.kw='';S.pos=0;buildList();render()};

/* 滑动切换（抽屉/灯箱打开时不触发） */
let tx=0,ty=0,tt=0;
document.addEventListener('touchstart',e=>{
  if(e.target.closest('.mdbody'))return;
  if($('drawer').classList.contains('open')||$('lb').classList.contains('show'))return;
  tx=e.touches[0].clientX;ty=e.touches[0].clientY;tt=Date.now();
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!tx)return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Date.now()-tt<600&&Math.abs(dx)>58&&Math.abs(dy)<50&&Math.abs(dx)>Math.abs(dy)) go(dx<0?1:-1);
  tx=0;
},{passive:true});

/* 键盘 */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Escape'){closeDrawer();closeLb();return}
  if(e.key==='ArrowRight')go(1);
  else if(e.key==='ArrowLeft')go(-1);
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!S.revealed)reveal();else go(1)}
  else if(e.key==='1')mark('k');
  else if(e.key==='2')mark('u');
});

/* ---------- 返回顶部：向下滚动超过阈值后浮现，点击平滑回顶 ---------- */
const stageEl=$('stage'), topBtnEl=$('topBtn');
stageEl.addEventListener('scroll',()=>{
  if(topBtnEl) topBtnEl.classList.toggle('show', stageEl.scrollTop>520);
},{passive:true});
if(topBtnEl) topBtnEl.addEventListener('click',()=>{
  try{ stageEl.scrollTo({top:0,behavior:'smooth'}); }
  catch(_){ stageEl.scrollTop=0; }
});

/* ---------- 题库已由上方 <script src="data.js"> 同步加载，无需异步逻辑 ---------- */

/* ---------- 启动 ---------- */
function start(){
  const b=$('bootOv'); if(b){ b.classList.add('done'); setTimeout(()=>{ if(b.remove)b.remove(); else b.style.display='none'; },260); }
  $('shuffleBtn').innerHTML=SHUF;
  renderCatBtn();renderFilters();buildList();
  const last=ld(LSP,null);
  if(last&&last.cat===S.cat&&last.filter===S.filter&&last.pos<S.list.length) S.pos=last.pos;
  render();
}
if(DATA && DATA.length){ start(); }
else {
  const ov=$('bootOv');
  const t=ov&&ov.querySelector('.boot-title'), s=ov&&ov.querySelector('.boot-sub'), r=ov&&ov.querySelector('.boot-retry');
  if(t) t.textContent='题库加载失败';
  if(s) s.textContent=window.__BGB_ERR__ ? '未找到 data.js（请确认同目录有 data.js 文件）' : '题库为空，请重新构建';
  if(r) r.classList.add('hide');
  console.error('DATA 未加载', window.__BGB_ERR__);
}
</script>
</body>
</html>
